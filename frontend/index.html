<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0b">
  <meta name="description" content="Offline-first construction materials stock, sales, forecasting, and replenishment workspace.">
  <title>SiteStock · Materials Operations</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/vendor/plotly.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><path d="M4 29h28M7 26V12l11-7 11 7v14M13 26v-9h10v9M4 12h28" stroke="currentColor" stroke-width="1.6"/><path d="M7 12h22" stroke="#D9A441" stroke-width="3"/></svg>
        </div>
        <div><div class="brand-name">SITESTOCK</div><div class="brand-sub">MATERIALS CONTROL</div></div>
      </div>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span><span>Dashboard</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span><span>Inventory</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="sales"><span class="nav-icon">↗</span><span>Sales</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="forecasting"><span class="nav-icon">⌁</span><span>Forecasting</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="replenishment"><span class="nav-icon">⤴</span><span>Replenishment</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="purchasing"><span class="nav-icon">▣</span><span>Purchasing</span><span class="nav-mark"></span></button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▧</span><span>Data &amp; Reports</span><span class="nav-mark"></span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="offline-pill"><span class="status-dot"></span> LOCAL WORKSPACE</div>
        <p>Operational records stay on this server. Historical source data is kept separate.</p>
        <div class="sidebar-version">SITESTOCK / 02.0</div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb"><span>OPERATIONS</span><i>/</i><strong id="crumb-page">DASHBOARD</strong></div>
        <div class="topbar-actions">
          <div class="topbar-date"><span class="status-dot"></span><span id="today-label">—</span></div>
          <button class="icon-button" id="refresh-button" aria-label="Refresh current page" title="Refresh">↻</button>
          <button class="mobile-menu" id="mobile-menu" aria-label="Toggle navigation">☰</button>
        </div>
      </header>

      <div class="network-strip" id="network-strip" aria-live="polite"><span class="spinner"></span><span id="network-message">Connecting to local inventory service…</span></div>
      <main id="page-view" tabindex="-1"></main>
      <footer class="app-footer"><span>LOCAL OPERATIONS • INDIAN RUPEES (INR)</span><span>NO EXTERNAL RUNTIME SERVICES</span></footer>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
