services:
  - type: web
    name: doon-ridge-materials
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AS_OF_DATE
        value: "2026-07-02"
      - key: INVENTORY_DB_URL
        value: sqlite:///data/inventory.db
    # Paid storage option: change plan to starter or another disk-eligible plan,
    # then uncomment the following block and use INVENTORY_DB_URL=sqlite:////var/data/inventory.db.
    # disk:
    #   name: doon-ridge-data
    #   mountPath: /var/data
    #   sizeGB: 1
